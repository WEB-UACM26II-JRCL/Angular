<div class="registro">
  <div class="encabezado">
    <button type="button" class="btn-regresar" (click)="regresar()">
      <img src="/iconos/retroceder.svg" alt="Icono de regresar">
    </button>
    <h1>{{ 'REGISTER' | translate }}</h1>
    <span class="espacio"></span>
  </div>

  <div class="tarjeta">
    <div class="progreso linea">
      @for (paso of pasos; track $index) {
        <div class="paso">
          <div class="circulo" [class.completado]="pasosComp[$index]" [class.actual]="$index === pasoActual">
            @if (pasosComp[$index]) {
              <span>&#10003;</span>
            }
          </div>
          <div class="contenedor-paso" (click)="paso.accion()">
            <p class="texto">{{ paso.texto | translate }}</p>
            <div class="icono">
              <img [src]="paso.icono" [alt]="paso.alt" />
            </div>
          </div>
        </div>
      }
    </div>
    <button class="registrar">{{ 'REG' | translate }}</button>
  </div>

  <div class="selector-idioma">
    <button type="button" (click)="cambiarIdioma('es')">Español</button>
    <button type="button" (click)="cambiarIdioma('en')">English</button>
  </div>
</div>
